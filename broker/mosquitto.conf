# Broker MQTT del Edge. Corre en la misma Raspberry Pi que el Edge API.
#
#   mosquitto -c broker/mosquitto.conf -v
#
# Crear el usuario antes de arrancar:
#   mosquitto_passwd -c broker/passwd esp32
#   mosquitto_passwd    broker/passwd edge-api

listener 1883

# Sin acceso anonimo: cada ESP32 y el propio Edge se autentican.
# En red local basta usuario y contrasena; TLS por el 8883 es lo que
# corresponderia en produccion.
allow_anonymous false
password_file broker/passwd

# Sesiones persistentes: si el Edge se reinicia, el broker le guarda los
# mensajes QoS 1 que llegaron mientras no estaba.
persistence true
persistence_location broker/data/
autosave_interval 60

# Un ESP32 desconectado no debe acumular mensajes indefinidamente.
max_queued_messages 1000
message_size_limit 65536

log_dest stdout
log_type error
log_type warning
log_type notice
